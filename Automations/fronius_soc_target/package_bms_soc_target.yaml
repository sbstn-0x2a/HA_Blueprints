# Helfer für "Solar Battery SOC Target Control v2".
# Behebt die zwei gemessenen Defekte der v1:
#   1) Rücklesen der Ladeleistung aus einer zeitweise "unavailable" Number
#      -> float(0) setzte die Rampe zurück. Ersatz: eigener Merker.
#   2) Netzleistung als Momentanwert aus einem Sensor, der sekündlich um
#      Kilowatt springt -> zufällige Zweigauswahl. Ersatz: 5-Minuten-Mittel.
# Angelegt 28.08.2026. Entfernen = diese Datei löschen + reload.

input_number:
  bms_v2_last_cmd:
    name: BMS v2 – zuletzt gesetzte Ladeleistung
    min: 0
    max: 20000
    step: 1
    unit_of_measurement: W
    mode: box
    icon: mdi:battery-charging-medium

# Seit 17.09.2026: Merker fuer die Hysterese der Prognose-Torwaechter
# (Tagesertrag und Peak-Stunde). Wird von der Automation selbst geschrieben.
# Optional - ohne Merker arbeiten die Torwaechter wie bisher ohne Hysterese.
input_boolean:
  bms_v2_torwaechter_offen:
    name: BMS v2 – Torwächter offen
    icon: mdi:gate-open

# Der 5-Minuten-Mittelwert der Netzleistung wurde als Config-Entry-Helfer angelegt
# (Statistics-Integration), nicht hier als YAML-Plattform - eine YAML-Plattform
# haette einen HA-Neustart gebraucht. Entitaet:
#   sensor.netzleistung_geglaettet_5_min
# Anlegen/Entfernen ueber Einstellungen -> Geraete & Dienste -> Helfer.
